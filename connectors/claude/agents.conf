# Champs propres à Claude Code, ajoutés au frontmatter des agents par install.sh.
# Format : <agent>.<champ>=<valeur>   (champs : model, tools, disallowedTools, effort… — voir la doc des subagents)
# model : toujours un alias (sonnet, opus, haiku, fable, inherit), jamais un ID daté.
# Relancer ./install.sh après modification.

spec.model=sonnet
spec.disallowedTools=Agent

architect.model=sonnet

coder.model=sonnet
coder.disallowedTools=Agent

reviewer.model=sonnet
reviewer.disallowedTools=Agent

validator.model=haiku
validator.disallowedTools=Agent

tester.model=sonnet
tester.disallowedTools=Agent
tester.mcpServers=[{"playwright": {"type": "stdio", "command": "npx", "args": ["-y", "@playwright/mcp@latest", "--headless", "--isolated", "--output-dir", ".ai-agents/playwright-mcp"]}}]
